  <script>

    let voices = DEFAULT_VOICES;

        // 字符计数
        textInput.addEventListener('input', () => {
          charCount.textContent = textInput.value.length + ' 字符';

        // 语言标签映射
        const langLabels = {
          'zh': '中文', 'CN': '中文', 'TW': '中文', 'HK': '中文', 'SG': '中文',
          'en': '英文', 'GB': '英文', 'US': '英文', 'AU': '英文', 'IE': '英文', 'ZA': '英文', 'IN': '英文',

          'fr': '法文', 'FR': '法文', 'CA': '法文',

          'ro': '罗马尼亚文', 'RO': '罗马尼亚文',
          'hu': '匈牙利文', 'HU': '匈牙利文',
          'bg': '保加利亚文', 'BG': '保加利亚文',
          'uk': '乌克兰文', 'UA': '乌克兰文',
          'el': '希腊文', 'GR': '希腊文',
          'sl': '斯洛文尼亚文', 'SI': '斯洛文尼亚文',
          'hr': '克罗地亚文', 'HR': '克罗地亚文',
          'ca': '加泰罗尼亚文', 'ES': '加泰罗尼亚文',
        };

        function getLangLabel(locale) {
          if (!locale) return '其他';
          const parts = locale.replace('-', '_').split('_');
          for (let i = parts.length - 1; i >= 0; i--) {
            const code = parts[i];
            if (langLabels[code]) return langLabels[code];
          }
          return locale;
        }

        // 填充语音下拉
        function populateVoiceList() {
          console.log('populateVoiceList 开始, voices.length:', voices.length);
          voiceSelect.innerHTML = '';

          // 按 Locale 分组
          const groups = {};
          voices.forEach((voice, i) => {
            const label = getLangLabel(voice.Locale);
            if (!groups[label]) groups[label] = [];
            groups[label].push({ voice: voice, index: i });
          });

          console.log('Locale 分组:', groups);

          // 语言优先级
          const priority = ['中文', '英文', '日文', '韩文'];
          const sortedLabels = [
            ...priority.filter(l => groups[l]),
            ...Object.keys(groups).filter(l => !priority.includes(l)).sort()
          ];

          let defaultIndex = 0;

          sortedLabels.forEach(label => {
            const optgroup = document.createElement('optgroup');
            optgroup.label = label + ' (' + groups[label].length + '种)';

            groups[label].forEach(({ voice, index }) => {
              const option = document.createElement('option');
              option.value = index;
              const cleanName = voice.FriendlyName
                .replace('Microsoft ', '')
                .replace(' Online (Natural) - ', ' - ')
                .replace(voice.Locale, '')
                .trim();
              option.textContent = cleanName;
              option.dataset.locale = voice.Locale;
              optgroup.appendChild(option);

              if (voice.ShortName === 'zh-CN-XiaoxiaoNeural') {
                defaultIndex = index;
              }
            });

            voiceSelect.appendChild(optgroup);
          });

          voiceSelect.selectedIndex = defaultIndex;
          const total = voices.length;
          voiceCount.textContent = `共 ${total} 种声音 · Edge 神经声音`;
          console.log('populateVoiceList 完成');
        }

        // ============================================================
        // 朗读按钮 - 完整重写（修复暂停/竞态/超时问题）
        // ============================================================
                let currentAudio = null;      // 当前播放的 Audio 对象
                let audioUrl = null;          // 当前 Blob URL（需要清理）
                let playbackState = 'idle';   // idle | loading | playing | paused | ended | error
                let isProcessing = false;     // 防抖标志

                // 强制清理旧音频资源
                function destroyAudio() {
                  try {
                    if (currentAudio) {
                      currentAudio.pause();
                      currentAudio.removeAttribute('src');
                      currentAudio.load();
                      currentAudio.onplay = null;
                      currentAudio.onpause = null;
                      currentAudio.onended = null;
                      currentAudio.onerror = null;
                      currentAudio.ontimeupdate = null;
                      currentAudio = null;
                    }
                    if (audioUrl) {
                      URL.revokeObjectURL(audioUrl);
                      audioUrl = null;
                    }
                  } catch (e) {
                    console.warn('destroyAudio:', e);
                  }
                }

                // 更新 UI（按钮文字 + 状态栏）
                function updateUI(state) {
                  playbackState = state;
                  switch (state) {
                    case 'idle':
                      speakBtnText.textContent = '▶ 开始朗读';
                      statusBar.textContent = '准备就绪';
                      statusBar.className = 'status-bar';
                      break;
                    case 'loading':
                      speakBtnText.textContent = '⏳ 生成中...';
                      statusBar.textContent = '⏳ 正在生成音频...';
                      statusBar.className = 'status-bar';
                      break;
                    case 'playing':
                      speakBtnText.textContent = '⏸ 暂停';
                      statusBar.textContent = '🔊 朗读中...';
                      statusBar.className = 'status-bar speaking';
                      break;
                    case 'paused':
                      speakBtnText.textContent = '▶ 继续朗读';
                      statusBar.textContent = '⏸ 已暂停';
                      statusBar.className = 'status-bar';
                      break;
                    case 'ended':
                      speakBtnText.textContent = '▶ 开始朗读';
                      statusBar.textContent = '✓ 朗读完成';
                      statusBar.className = 'status-bar success';
                      break;
                    case 'error':
                      speakBtnText.textContent = '▶ 开始朗读';
                      statusBar.className = 'status-bar error';
                      break;
                  }
                }

                // 点击朗读按钮 - 简化三态
                async function toggleSpeech() {
                  // 防抖：如果正在处理（loading），忽略点击
                  if (playbackState === 'loading') {
                    console.log('正在加载中，忽略点击');
                    return;
                  }

                  if (playbackState === 'idle' || playbackState === 'ended' || playbackState === 'error') {
                    // 开始新朗读
                    const text = textInput.value.trim();
                    if (!text) {
                      statusBar.textContent = '请先输入要朗读的文字';
                      statusBar.className = 'status-bar error';
                      setTimeout(() => {
                        if (playbackState === 'idle') {
                          statusBar.textContent = '准备就绪';
                          statusBar.className = 'status-bar';
                        }
                      }, 2000);
                      return;
                    }
                    await startSpeech(text);
                  } else if (playbackState === 'playing') {
                    // 暂停
                    if (currentAudio) {
                      currentAudio.pause();
                      updateUI('paused');
                    }
                  } else if (playbackState === 'paused') {
                    // 继续
                    if (currentAudio) {
                      currentAudio.play().catch(err => {
                        console.error('Play failed:', err);
                        updateUI('error');
                        statusBar.textContent = '✗ 继续播放失败: ' + err.message;
                        setTimeout(() => updateUI('idle'), 3000);
                      });
                      updateUI('playing');
                    }
                  }
                }

                async function startSpeech(text) {
                  updateUI('loading');

                  try {
                    const audioBuffer = await generateAudio(text);
                    if (!audioBuffer || audioBuffer.length < 100) {
                      throw new Error('音频数据无效');
                    }

                    // 清理旧资源
                    destroyAudio();

                    // 创建 Blob
                    const blob = new Blob([audioBuffer], { type: 'audio/mpeg' });
                    audioUrl = URL.createObjectURL(blob);

                    // 创建 Audio（先不设 src，等 canplaythrough 再 play）
                    const audio = new Audio();
                    audio.preload = 'auto';
                    audio.playbackRate = parseFloat(rateSlider.value) || 1.0;
                    audio.volume = parseFloat(volumeSlider.value) || 1.0;
                    currentAudio = audio;

                    // 设置事件
                    audio.onplay = () => {
                      console.log('Audio onplay');
                      updateUI('playing');
                    };

                    audio.onpause = () => {
                      console.log('Audio onpause, state:', playbackState);
                      // 只在 playing 状态下 pause 才说明用户手动暂停
                      if (playbackState === 'playing') {
                        updateUI('paused');
                      }
                    };

                    audio.onended = () => {
                      console.log('Audio onended');
                      updateUI('ended');
                      setTimeout(() => {
                        if (playbackState === 'ended') updateUI('idle');
                      }, 2000);
                    };

                    audio.onerror = (e) => {
                      console.error('Audio error:', e);
                      updateUI('error');
                      statusBar.textContent = '✗ 音频播放失败';
                      setTimeout(() => updateUI('idle'), 3000);
                    };

                    // 60 秒超时（如果音频一直没结束，认为出问题了）
                    let playbackTimeout;
                    const startPlaybackTimer = () => {
                      clearTimeout(playbackTimeout);
                      playbackTimeout = setTimeout(() => {
                        if (playbackState === 'playing' || playbackState === 'paused') {
                          console.warn('Playback timeout - force reset');
                          destroyAudio();
                          updateUI('error');
                          statusBar.textContent = '✗ 播放超时';
                          setTimeout(() => updateUI('idle'), 3000);
                        }
                      }, 60000);  // 60秒
                    };

                    // 等音频准备好再播放（避免开头重复）
                    await new Promise((resolve, reject) => {
                      const onReady = () => {
                        audio.removeEventListener('canplaythrough', onReady);
                        audio.removeEventListener('error', onError);
                        clearTimeout(readyTimeout);
                        resolve();
                      };
                      const onError = (e) => {
                        audio.removeEventListener('canplaythrough', onReady);
                        audio.removeEventListener('error', onError);
                        clearTimeout(readyTimeout);
                        reject(new Error('音频加载失败'));
                      };
                      audio.addEventListener('canplaythrough', onReady, { once: true });
                      audio.addEventListener('error', onError, { once: true });
                      audio.src = audioUrl;
                      audio.load();
                      // 30 秒准备超时
                      const readyTimeout = setTimeout(() => {
                        audio.removeEventListener('canplaythrough', onReady);
                        audio.removeEventListener('error', onError);
                        console.warn('Audio ready timeout, forcing play');
                        resolve();  // 即使超时也尝试播放
                      }, 30000);
                    });

                    // 开始播放
                    startPlaybackTimer();
                    await audio.play();

                  } catch (err) {
                    console.error('startSpeech error:', err);
                    destroyAudio();
                    updateUI('error');
                    statusBar.textContent = '✗ ' + (err.message || '未知错误');
                    setTimeout(() => updateUI('idle'), 3000);
                  }
                }

        // 生成音频（核心函数 - 带 fallback）
        async function generateAudio(text) {
          const selectedIdx = voiceSelect.selectedIndex;
          const selectedVoice = voices[selectedIdx];
          if (!selectedVoice) throw new Error('未选择语音');

          // 把 rate 0.5-2.0 转换成 -50% 到 +100%
          const rateVal = parseFloat(rateSlider.value) || 1.0;
          const ratePercent = Math.round((rateVal - 1.0) * 100);
          const rateStr = (ratePercent >= 0 ? '+' : '') + ratePercent + '%';

          // volume 0-1 转 -50% 到 +50%
          const volVal = parseFloat(volumeSlider.value) || 1.0;
          const volPercent = Math.round((volVal - 1.0) * 100);
          const volStr = (volPercent >= 0 ? '+' : '') + volPercent + '%';

          // 准备 fallback 列表（如果选的声音失败，尝试其他）
          const voicesToTry = [selectedVoice];
          // 同语言的其他声音作为 fallback
          const sameLang = voices.filter(v =>
            v.Locale === selectedVoice.Locale && v.ShortName !== selectedVoice.ShortName
          );
          voicesToTry.push(...sameLang.slice(0, 3));

          // 逐个尝试
          let lastError = null;
          for (let i = 0; i < voicesToTry.length; i++) {
            const voice = voicesToTry[i];
            const isPrimary = i === 0;

            try {
              const result = await tryGenerate(text, voice, rateStr, volStr);
              if (isPrimary) {
                return result;
              } else {
                // Fallback 成功了，告诉用户
                statusBar.textContent = `原声音失败，已自动切换到 ${voice.FriendlyName.split(' - ')[0].replace('Microsoft ', '')}`;
                return result;
              }
            } catch (err) {
              lastError = err;
              console.warn(`Voice ${voice.ShortName} failed:`, err.message);
              if (isPrimary) {
                statusBar.textContent = `声音 ${voice.ShortName} 失败，尝试其他...`;
              }
            }
          }

          throw lastError || new Error('所有声音都失败');
        }

        // 单次尝试
        async function tryGenerate(text, voice, rateStr, volStr) {
          // 30 秒超时
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 30000);

          let response;
          try {
            response = await fetch(window.EdgeTTS.WORKER_URL + '/api/tts', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                text: text,
                voice: voice.ShortName,
                rate: rateStr,
                volume: volStr,
              }),
              signal: controller.signal,
            });
          } catch (err) {
            clearTimeout(timeout);
            if (err.name === 'AbortError') {
              throw new Error('生成超时(30秒)');
            }
            throw err;
          }
          clearTimeout(timeout);

          if (!response.ok) {
            let errMsg = 'HTTP ' + response.status;
            try {
              const errBody = await response.text();
              errMsg += ': ' + errBody.substring(0, 200);
            } catch (e) {}
            throw new Error(errMsg);
          }

          const contentType = response.headers.get('content-type') || '';
          if (!contentType.includes('audio')) {
            const errText = await response.text();
            throw new Error('返回非音频: ' + errText.substring(0, 100));
          }

          const buffer = await response.arrayBuffer();
          return new Uint8Array(buffer);
        }

        function escapeXml(text) {
          return String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&apos;');
        }

        // 下载音频
        async function downloadAudio() {
          const text = textInput.value.trim();
          if (!text) {
            statusBar.textContent = '请先输入要转换的文字';
            statusBar.className = 'status-bar error';
            setTimeout(() => statusBar.className = 'status-bar', 2000);
            return;
          }

          if (text.length > 2000) {
            statusBar.textContent = '文字不能超过2000字符，请分段转换';
            statusBar.className = 'status-bar error';
            setTimeout(() => statusBar.className = 'status-bar', 3000);
            return;
          }

          if (isDownloading) return;

          isDownloading = true;
          downloadBtn.disabled = true;
          downloadBtnText.innerHTML = '<span class="loading-spinner"></span> 生成中...';
          statusBar.textContent = '正在生成音频，请稍候...';
          statusBar.className = 'status-bar';

          try {
            const audioBuffer = await generateAudio(text);
            const blob = new Blob([audioBuffer], { type: 'audio/mpeg' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const selectedVoice = voices[voiceSelect.selectedIndex];
            a.download = `tts_${selectedVoice.ShortName}_${Date.now()}.mp3`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);

            statusBar.textContent = '✓ 下载成功！';
            statusBar.className = 'status-bar success';
            setTimeout(() => { if (statusBar.className === 'status-bar success') statusBar.className = 'status-bar'; }, 2000);

          } catch (err) {
            console.error('Download error:', err);
            statusBar.textContent = '下载失败: ' + (err.message || '请稍后重试');
            statusBar.className = 'status-bar error';
            setTimeout(() => statusBar.className = 'status-bar', 3000);
          } finally {
            isDownloading = false;
            downloadBtn.disabled = false;
            downloadBtnText.innerHTML = '⬇ 下载MP3';
          }
        }

        function resetAll() {
          destroyAudio();
          updateUI('idle');
          textInput.value = '';
          charCount.textContent = '0 字符';
          rateSlider.value = 1;
          volumeSlider.value = 1;
          rateValue.textContent = '1.0x';
          volumeValue.textContent = '100%';
        }

        rateSlider.addEventListener('input', () => {
          rateValue.textContent = parseFloat(rateSlider.value).toFixed(1) + 'x';
          if (currentAudio) currentAudio.playbackRate = parseFloat(rateSlider.value);
        });

        volumeSlider.addEventListener('input', () => {
          volumeValue.textContent = Math.round(parseFloat(volumeSlider.value) * 100) + '%';
          if (currentAudio) currentAudio.volume = parseFloat(volumeSlider.value);
        });

        speakBtn.addEventListener('click', toggleSpeech);
        downloadBtn.addEventListener('click', downloadAudio);
        resetBtn.addEventListener('click', resetAll);

        // 初始化
        try {
          if (!window.EdgeTTS || !window.EdgeTTS.DEFAULT_VOICES) {
            throw new Error('EdgeTTS 模块未加载');
          }
          if (!voiceSelect) {
            throw new Error('声音选择器不存在');
          }
          populateVoiceList();
          console.log('✓ Edge TTS 初始化成功，32 个语音');
        } catch (err) {
          console.error('Init error:', err);
          if (statusBar) {
            statusBar.textContent = '⚠ 初始化错误: ' + err.message;
            statusBar.className = 'status-bar error';
          }
        }

        // 页面关闭时清理
        window.addEventListener('beforeunload', () => {
          if (currentAudio) currentAudio.pause();
        });
      </script>
    </body>
  </html>
