<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>WebSocket 测试</title>
<style>
body { font-family: -apple-system, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
.box { background: white; padding: 20px; border-radius: 8px; margin: 16px 0; border: 1px solid #ddd; }
.ok { background: #e8f5e9; border-color: #2e7d32; }
.fail { background: #ffebee; border-color: #c62828; }
pre { background: #f8f9fa; padding: 12px; border-radius: 4px; overflow-x: auto; }
button { background: #1a73e8; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; cursor: pointer; margin: 4px; }
</style>
</head>
<body>
<h1>🔬 WebSocket 详细诊断</h1>

<div id="results"></div>

<button id="btn1">测试 1: 仅 WebSocket</button>
<button id="btn2">测试 2: HTTP fetch</button>

<script>
const results = document.getElementById('results');

function add(html, type = '') {
  const div = document.createElement('div');
  div.className = 'box ' + type;
  div.innerHTML = html;
  results.appendChild(div);
}

document.getElementById('btn1').addEventListener('click', () => {
  results.innerHTML = '';
  add('⏳ 测试 WebSocket...', '');

  const ws = new WebSocket('wss://speech.platform.bing.com/consumer/speech/synthesize/readaloud/edge/v1?TrustedClientToken=6A5AA1D4EAFF4E9FB37E23D68491D6F4');
  const startTime = Date.now();

  ws.onopen = () => {
    const dur = Date.now() - startTime;
    add('✅ 测试 1 成功！WebSocket 连接成功 (' + dur + 'ms)<br>jinyj 的浏览器可以直接调 Edge TTS！', 'ok');
    ws.close();
  };

  ws.onerror = (e) => {
    add('❌ 测试 1 失败：WebSocket 连接错误<br>详情: ' + JSON.stringify({type: e.type || 'unknown', message: e.message || 'unknown'}), 'fail');
  };

  ws.onclose = (e) => {
    if (e.code !== 1000) {
      add('⚠️ WebSocket 关闭<br>Code: ' + e.code + '<br>Reason: ' + (e.reason || 'no reason'), 'fail');
    }
  };

  // 10秒超时
  setTimeout(() => {
    if (ws.readyState !== 1) {
      add('⏱️ 10秒超时，WebSocket 未连接', 'fail');
      ws.close();
    }
  }, 10000);
});

document.getElementById('btn2').addEventListener('click', () => {
  results.innerHTML = '';
  add('⏳ 测试 HTTP fetch...', '');

  fetch('https://speech.platform.bing.com/consumer/speech/synthesize/readaloud/voices/list?trustedclienttoken=6A5AA1D4EAFF4E9FB37E23D68491D6F4')
    .then(r => r.json())
    .then(d => add('✅ HTTP 通！获取到 ' + d.length + ' 个语音', 'ok'))
    .catch(e => add('❌ HTTP 失败: ' + e.message, 'fail'));
});
</script>
</body>
</html>
